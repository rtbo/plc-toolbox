[package]
name = "ua-browser"
version = "0.1.0"
description = "A browser for OPC/UA devices"
authors = ["Rémi Thebault"]
license = "MIT"
repository = "https://github.com/rtbo/plc-toolbox"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
serde_json = "1.0"

[dependencies]
log.workspace = true
open62541.workspace = true
open62541-sys.workspace = true
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
