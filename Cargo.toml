[workspace]
resolver = "3"
members = [
  "tests/plc-mock",
  "ua-browser/src-tauri",
  "ua-cat",
  "ua-client",
  "ua-core",
  "ua-lab",
  "ua-macros",
  "ua-nsc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/rtbo/plc-toolbox"
license = "MIT"

[workspace.dependencies]
ua-client = { path = "ua-client" }
ua-core = { path = "ua-core" }
ua-macros = { path = "ua-macros" }
ua-nsc = { path = "ua-nsc" }

anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4"
open62541 = {
  version = "0.12.0",
  features = [
    "serde",
    "time",
    "tokio",
    "uuid",
  ]
}
open62541-sys = "0.6.2"
quick-xml = { version = "0.42.0", features = ["async-tokio"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
