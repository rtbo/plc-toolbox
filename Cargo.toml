[workspace]
resolver = "3"
members = ["opcua", "ua-browser/src-tauri", "ua-cat", "tests/plc-mock"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Rémi Thebault <remi.thebault@gmail.com>"]
license = "MIT"
repository = "https://github.com/rtbo/plc-toolbox"

[workspace.dependencies]
opcua = { path = "opcua" }
log = "0.4"
open62541 = { version = "0.12.0", features = ["uuid"] }
open62541-sys = "0.6.2"
tokio = { version = "1", features = ["full"] }
